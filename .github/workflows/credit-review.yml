name: Credit Review Lab v2
on:
  push:
    paths: ['v2/**', '.github/workflows/credit-review.yml']
  pull_request:
    paths: ['v2/**', '.github/workflows/credit-review.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt playwright
      - run: python -m unittest discover -s tests -v
      - run: python benchmark.py
      - run: python -m playwright install --with-deps chromium
      - run: |
          python -m uvicorn credit_review.api:app > /tmp/credit-review.log 2>&1 &
          server=$!
          trap 'kill "$server"; cat /tmp/credit-review.log' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8000/health
          python tests/browser_smoke.py
