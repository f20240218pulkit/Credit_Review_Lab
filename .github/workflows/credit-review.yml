name: Credit Review Lab v2
on:
  push:
    paths: ['v2/**', '.github/workflows/credit-review.yml']
  pull_request:
    paths: ['v2/**', '.github/workflows/credit-review.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: credit_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: credit_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credit_test -d credit_review"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt playwright
      - run: python -m unittest discover -s tests -v
      - name: Verify the hosted database workflow
        env:
          CREDIT_DATABASE_URL: postgresql://credit_test:test_only@localhost:5432/credit_review
        run: python -m unittest discover -s tests -v
      - run: python benchmark.py
      - name: Prepare Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            echo CREDIT_CHROME_CHANNEL=chrome >> "$GITHUB_ENV"
          else
            python -m playwright install chromium
          fi
      - name: Verify public startup and review flow
        env:
          CREDIT_PUBLIC_DEMO: "1"
        run: |
          python -m uvicorn credit_review.api:app > /tmp/credit-review.log 2>&1 &
          server=$!
          trap 'kill "$server"; cat /tmp/credit-review.log' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8000/health
          python tests/browser_smoke.py
      - name: Verify team intake and sign-off in the browser
        env:
          CREDIT_PUBLIC_DEMO: "1"
          CREDIT_PILOT_TEST_AUTH: "1"
          CREDIT_PILOT_INVITE_ONLY: "1"
          CREDIT_PILOT_ADMINS: owner@example.test
          CREDIT_TEST_URL: http://127.0.0.1:8001
        run: |
          export CREDIT_DB="$(mktemp -d)/team-pilot.sqlite"
          python -m uvicorn --app-dir tests pilot_browser_app:app --port 8001 > /tmp/credit-team.log 2>&1 &
          server=$!
          trap 'kill "$server"; cat /tmp/credit-team.log' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8001/ready
          python tests/browser_pilot.py
