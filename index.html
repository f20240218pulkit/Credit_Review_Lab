<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credit Review Lab</title>
<style>
:root{color-scheme:light;--ink:#142b30;--muted:#486064;--line:#d8e4df;--green:#00604c;--paper:#f0f5f2}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,sans-serif}
header{background:#113735;color:#fff;padding:36px max(24px,calc((100% - 1120px)/2));border-bottom:5px solid #63c7a6}h1{font-size:clamp(32px,6vw,56px);letter-spacing:-.05em;line-height:1.05;margin:8px 0 12px}header p{max-width:650px;margin:0;color:#deeee8}.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
main{max-width:1168px;margin:auto;padding:24px}section,details{background:white;border:1px solid var(--line);border-radius:13px;padding:20px;margin:0 0 16px}h2{font-size:21px;letter-spacing:-.02em;margin:0 0 10px}h3{font-size:16px;margin:12px 0 4px}p{margin:0 0 10px}.muted{color:var(--muted)}.controls{display:flex;flex-wrap:wrap;align-items:end;gap:12px}label{font-weight:650;display:block}button,select,input{font:inherit;color:inherit;border:1px solid #9fb5ae;border-radius:7px;background:#fff;padding:8px 11px;max-width:100%}button{cursor:pointer;background:var(--green);color:white;border-color:var(--green);font-weight:650}button.secondary{background:white;color:var(--green)}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ac7b26;outline-offset:2px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:10px;margin-bottom:16px}.card{padding:14px;background:#eaf4ee;border-radius:8px}.card strong{font-size:26px;display:block}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:610px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#eef5f0}.num{font-variant-numeric:tabular-nums;white-space:nowrap}.tag{font-size:12px;padding:2px 7px;border-radius:4px;background:#edf3f0;display:inline-block}.warn{background:#fff0d4;color:#633800}.error{color:#8b2727}code{overflow-wrap:anywhere}pre{white-space:pre-wrap;background:#eef5f0;padding:14px;border-radius:6px}summary{cursor:pointer;font-weight:700}footer{color:var(--muted)}.sub{font-size:13px}.status{font-weight:700;color:var(--green)}.fields{display:flex;gap:8px;flex-wrap:wrap}a{color:var(--green)}
</style>
</head>
<body>
<header><div class="eyebrow">SME lending · Synthetic case files</div><h1>Credit Review Lab</h1><p>Spread financial statements, trace figures to their source, and prepare a review packet for a credit analyst.</p></header>
<main>
<section class="controls">
<div><label for="case">Borrower case</label><select id="case"></select></div>
<button id="export">Export evidence packet</button>
<button id="download" class="secondary">Download source statements</button>
</section>
<div id="workbench"></div>
<details><summary>Mapping evaluation</summary><div id="evaluation"></div></details>
<footer>Independent portfolio prototype · Synthetic data · Figures in INR unless a source row states otherwise.</footer>
</main>
<script>
"use strict";
const labels = {
  revenue: ["sales revenue", "operating turnover", "net operating sales", "revenue from operations"],
  ebitda: ["ebitda", "operating earnings before depreciation", "earnings before interest tax depreciation amortisation", "adjusted ebitda"],
  current_assets: ["current assets", "total short term assets", "aggregate current assets", "current asset subtotal"],
  current_liabilities: ["current liabilities", "total short term liabilities", "aggregate current liabilities", "current liability subtotal"],
  assets: ["total assets", "aggregate assets", "assets grand total", "balance sheet assets"],
  liabilities: ["total liabilities", "aggregate liabilities", "liabilities grand total", "total external liabilities"],
  equity: ["total equity", "shareholders funds", "net worth", "owners equity"],
  debt: ["total debt", "interest bearing debt", "aggregate borrowings", "financing debt"],
  operating_cash: ["cash from operations", "operating cash flow", "net cash from operating activities", "cash generated by operations"],
  debt_service: ["annual debt service", "scheduled principal and interest", "debt service payments", "principal plus interest"]
};
const names = {
  revenue:"Revenue", ebitda:"EBITDA", current_assets:"Current assets", current_liabilities:"Current liabilities",
  assets:"Total assets", liabilities:"Total liabilities", equity:"Total equity", debt:"Interest-bearing debt",
  operating_cash:"Operating cash flow", debt_service:"Scheduled debt service"
};
const keys = Object.keys(names);
const sourceType = ["Income statement","Income statement","Balance sheet","Balance sheet","Balance sheet","Balance sheet","Balance sheet","Balance sheet","Cash flow statement","Debt schedule"];
const years = [2025,2026];
const base = [
  [10400,1540,3200,2100,6400,4200,2200,3100,1030,680],
  [11600,1620,3400,2500,7100,4750,2350,3650,950,800]
];
const variants = [
  ["Operating sales","EBITDA (reported)","Total current assets","Current liabilities total","Assets total","Liabilities total","Owners’ total equity","Interest-bearing borrowings","Net operating cash flow","Scheduled debt service"],
  ["Revenue from core operations","EBITDA before adjustments","Current asset total","Current liability total","Total balance sheet assets","Aggregate total liabilities","Shareholders’ equity funds","Total financial debt","Cash generated from operations","Annual principal plus interest"]
];
const cases = [
  {id:"CR-101",name:"Aster Components",description:"Two years of consistent statements. Inspect the decline in cash coverage despite higher sales."},
  {id:"CR-102",name:"Meridian Packaging",description:"A conflicting revenue entry, a balance sheet discrepancy, and debt service recorded as zero."},
  {id:"CR-103",name:"Juniper Industrial",description:"An ambiguous line label, a missing cash flow line, and a debt schedule supplied in a different currency."}
];
function buildRows(id){
  const rows = years.flatMap((year,i)=>keys.map((key,j)=>({
    id:year+"-"+String(j+1).padStart(2,"0"),year,label:variants[i][j],
    value:base[i][j],unit:"thousands",currency:"INR",document:sourceType[j],line:j+1
  })));
  if(id==="CR-102"){
    rows.find(row=>row.id==="2026-05").value=7350;
    rows.find(row=>row.id==="2026-10").value=0;
    rows.push({...rows.find(row=>row.id==="2026-01"),id:"2026-11",line:11,value:11900,label:"Sales revenue"});
  }
  if(id==="CR-103"){
    rows.find(row=>row.id==="2026-02").label="Result before allocations";
    rows.find(row=>row.id==="2026-10").currency="USD";
    return rows.filter(row=>row.id!=="2026-09");
  }
  return rows;
}
const normalise = value=>value.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9]+/g," ").trim();
function vector(value){
  const input=" "+normalise(value)+" ";
  const counts=new Map();
  for(let i=0;i<input.length-2;i++){
    const gram=input.slice(i,i+3);
    counts.set(gram,(counts.get(gram)||0)+1);
  }
  const length=Math.hypot(...counts.values());
  return new Map([...counts].map(([key,count])=>[key,count/length]));
}
const training=Object.entries(labels).flatMap(([key,examples])=>examples.map(text=>({key,grams:vector(text)})));
function classify(text){
  const query=vector(text);
  const scores=keys.map(key=>({
    key,score:Math.max(...training.filter(item=>item.key===key).map(item=>
      [...query].reduce((sum,[gram,weight])=>sum+weight*(item.grams.get(gram)||0),0)))
  })).sort((a,b)=>b.score-a.score);
  const [first,second]=scores;
  return {key:first.score>=0.46 && first.score-second.score>=0.09 ? first.key:null,score:first.score,margin:first.score-second.score};
}
const metricSpecs=[
  {name:"Current ratio",keys:["current_assets","current_liabilities"],suffix:"×"},
  {name:"Debt / EBITDA",keys:["debt","ebitda"],suffix:"×"},
  {name:"Operating cash / debt service",keys:["operating_cash","debt_service"],suffix:"×"},
  {name:"EBITDA margin",keys:["ebitda","revenue"],suffix:"%",scale:100}
];
function analyse(rows, decisions={}){
  const mapped=rows.map(row=>{
    const model=classify(row.label);
    const decision=decisions[row.id];
    const key=decision ? decision.key : model.key;
    return {...row,key,model,decision:decision||null,amount:row.currency==="INR"&&row.unit==="thousands"?row.value*1000:null};
  });
  const issues=[];
  for(const row of mapped){
    if(row.amount===null) issues.push({year:row.year,message:"Unsupported currency or unit",refs:[row.id]});
    if(!row.key && !row.decision) issues.push({year:row.year,message:"Unmapped statement line",refs:[row.id]});
  }
  const annual=years.map(year=>{
    const accounts={};
    for(const key of keys){
      const matches=mapped.filter(row=>row.year===year && row.key===key);
      const refs=matches.map(row=>row.id);
      let status="Available";
      if(!matches.length) status="Missing";
      else if(matches.length>1) status="Duplicate";
      else if(matches[0].amount===null) status="Unsupported source";
      const value=status==="Available"?matches[0].amount:null;
      if(status!=="Available") issues.push({year,message:names[key]+" · "+status,refs});
      accounts[key]={value,refs,status};
    }
    const balanceInputs=["assets","liabilities","equity"].map(key=>accounts[key]);
    const checkable=balanceInputs.every(input=>input.value!==null);
    const gap=checkable?balanceInputs[0].value-balanceInputs[1].value-balanceInputs[2].value:null;
    const balanceRefs=balanceInputs.flatMap(input=>input.refs);
    if(gap!==0) issues.push({year,message:gap===null?"Balance sheet check unavailable":"Balance sheet difference "+money(gap),refs:balanceRefs});
    const metrics=metricSpecs.map(spec=>{
      const [numerator,denominator]=spec.keys.map(key=>accounts[key]);
      const refs=[...numerator.refs,...denominator.refs];
      let reason=null;
      if(numerator.value===null||denominator.value===null) reason="Input unavailable";
      else if(denominator.value<=0) reason="Denominator must be positive";
      if(reason) issues.push({year,message:spec.name+" · "+reason,refs});
      return {name:spec.name,formula:spec.keys.map(key=>names[key]).join(" / "),refs,reason,
        value:reason?null:numerator.value/denominator.value*(spec.scale||1),suffix:spec.suffix};
    });
    return {year,accounts,balance:{gap,refs:balanceRefs},metrics};
  });
  const needsMapping=mapped.filter(row=>row.key && !row.decision).length;
  return {mapped,annual,issues,needsMapping};
}
const evaluation=[
  ["Annual operating turnover","revenue"],["Core operating sales","revenue"],["Reported EBITDA","ebitda"],
  ["Total current assets","current_assets"],["Current liabilities subtotal","current_liabilities"],
  ["Grand total assets","assets"],["Total external liabilities reported","liabilities"],
  ["Owners’ total equity","equity"],["Interest bearing borrowings","debt"],
  ["Net operating cash flow","operating_cash"],["Scheduled debt service","debt_service"],
  ["Intercompany memo",null],["Closing remarks",null],["Result before allocations",null],
  ["Outstanding disputes",null],["Employee training provision",null],["Sales and marketing expenses",null],
  ["Noncurrent asset total",null],["EBITDA margin percentage",null]
];
const money=value=>value===null?"—":new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0}).format(value);
const safe=value=>String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const get=id=>document.getElementById(id);
const refs=ids=>ids.length?ids.map(id=>'<a href="#row-'+id+'">'+id+'</a>').join(", "):"No matching source";
const metricValue=item=>item.value===null?"—":item.value.toFixed(2)+item.suffix;
const reviewsByCase = Object.fromEntries(cases.map(item=>[item.id,{decisions:{},log:[]}]));
function activeReview(){
  return reviewsByCase[get("case").value];
}
function state(){
  const borrower=cases.find(item=>item.id===get("case").value);
  return {borrower,...analyse(buildRows(borrower.id),activeReview().decisions)};
}
function memo({borrower,annual,issues,needsMapping}){
  const current=annual.at(-1);
  const previous=annual[0];
  const lines=[borrower.id+" · "+borrower.name,"Draft evidence memo · FY"+current.year,
    ...current.metrics.map((item,index)=>item.name+" "+metricValue(item)+" (prior "+metricValue(previous.metrics[index])+"). "+(item.reason?item.reason+". ":"")+"Source: "+(item.refs.join(", ")||"missing")+".")];
  lines.push(issues.length+" open exceptions across both periods. "+needsMapping+" model assignments awaiting confirmation.");
  for(const issue of issues) lines.push("FY"+issue.year+" · "+issue.message+" · "+(issue.refs.join(", ")||"no matching source"));
  lines.push("Analyst to validate the evidence and apply the institution’s credit policy.");
  return lines.join("\n");
}
function render(){
  const data=state();
  const active=document.activeElement?.id;
  const current=data.annual.at(-1);
  get("workbench").innerHTML=
    '<section><div class="eyebrow muted">'+data.borrower.id+'</div><h2>'+data.borrower.name+'</h2><p>'+data.borrower.description+'</p>'+
    '<p class="status" role="status">'+data.issues.length+' open exceptions · '+data.needsMapping+' model assignments awaiting confirmation</p>'+
    '<p class="muted sub">Provisional ratios based on available inputs. Review notes are retained until you close or reload this page.</p><div class="cards">'+current.metrics.map((item,i)=>'<div class="card">'+item.name+'<strong>'+metricValue(item)+'</strong><div class="sub">FY25 '+metricValue(data.annual[0].metrics[i])+'</div><div class="sub">'+refs(item.refs)+'</div></div>').join("")+'</div></section>'+
    '<section><h2>Reconciliation and exceptions</h2>'+data.annual.map(entry=>'<p>FY'+entry.year+' balance sheet · '+(entry.balance.gap===null?'Unavailable':entry.balance.gap===0?'Reconciled':'Difference '+money(entry.balance.gap))+' · '+refs(entry.balance.refs)+'</p>').join("")+
    (data.issues.length?'<ul>'+data.issues.map(issue=>'<li>FY'+issue.year+' · '+safe(issue.message)+' · '+refs(issue.refs)+'</li>').join("")+'</ul>':'<p>No exceptions from the configured checks.</p>')+'</section>'+
    '<details><summary>Financial spread</summary><div class="scroll"><table><thead><tr><th>Account</th><th>FY2025</th><th>FY2026</th></tr></thead><tbody>'+
    keys.map(key=>'<tr><th scope="row">'+names[key]+'</th>'+data.annual.map(entry=>{const line=entry.accounts[key];return '<td class="num">'+money(line.value)+' · '+safe(line.status)+'<br>'+refs(line.refs)+'</td>';}).join("")+'</tr>').join("")+'</tbody></table></div></details>'+
    '<section><h2>Source ledger and mapping review</h2><p class="muted">Inspect model suggestions and confirm or correct individual mappings. Excluding a row requires a reason, recorded in the exported review log.</p>'+
    '<form id="review" class="fields"><label>Source row <select id="reviewRow">'+data.mapped.map(row=>'<option value="'+row.id+'">'+row.id+' · '+safe(row.label)+'</option>').join("")+'</select></label>'+
    '<label>Mapping <select id="reviewKey"><option value="">Exclude row</option>'+keys.map(key=>'<option value="'+key+'">'+names[key]+'</option>').join("")+'</select></label>'+
    '<label>Review reason <input id="reason" required maxlength="160" placeholder="Verified against source"></label><button id="apply">Save review</button></form>'+
    '<p id="notice" aria-live="polite"></p><div class="scroll"><table><thead><tr><th>Row / document</th><th>Source label</th><th>As stated</th><th>Mapping</th><th>Similarity</th><th>Review</th></tr></thead><tbody>'+
    data.mapped.map(row=>'<tr id="row-'+row.id+'"><td>'+row.id+'<br><small>'+row.document+' · line '+row.line+'</small></td><td>'+safe(row.label)+'</td><td class="num">'+row.value.toLocaleString("en-IN")+' '+row.currency+'k</td><td>'+(names[row.key]||"—")+'</td><td>'+row.model.score.toFixed(2)+'</td><td><button type="button" class="secondary" data-row="'+row.id+'">'+(row.decision?"Edit review":"Review")+'</button></td></tr>').join("")+
    '</tbody></table></div></section><details><summary>Draft analyst memo</summary><pre>'+safe(memo(data))+'</pre></details>';
  function select(rowId){
    const row=data.mapped.find(item=>item.id===rowId);
    get("reviewRow").value=row.id;
    get("reviewKey").value=row.key||"";
    get("reason").value=row.decision?.reason||"";
  }
  get("reviewRow").onchange=event=>select(event.target.value);
  select(data.mapped[0].id);
  get("workbench").querySelectorAll("[data-row]").forEach(button=>button.onclick=()=>{select(button.dataset.row); get("reason").focus();});
  get("review").onsubmit=event=>{
    event.preventDefault();
    const id=get("reviewRow").value;
    const reason=get("reason").value.trim();
    if(!reason){get("notice").textContent="Enter a review reason.";return;}
    const before=data.mapped.find(row=>row.id===id).key;
    const key=get("reviewKey").value||null;
    const entry={id,before,key,reason,at:new Date().toISOString()};
    activeReview().decisions[id]=entry;
    activeReview().log.push(entry);
    render();
    select(id);
    get("notice").textContent="Saved review for "+id+". Ratios and exceptions recalculated.";
    get("apply").focus();
  };
  if(active==="case") get("case").focus();
}
function save(filename,data,type){
  const url=URL.createObjectURL(new Blob([data],{type}));
  const link=document.createElement("a");
  link.href=url;
  link.download=filename;
  link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function evaluate(){
  const exact=new Map(Object.entries(labels).flatMap(([key,examples])=>examples.map(text=>[normalise(text),key])));
  const scored=evaluation.map(([label,expected])=>({label,expected,baseline:exact.get(normalise(label))||null,prediction:classify(label).key}));
  return {scored, totals: {
    cases:scored.length,known:scored.filter(row=>row.expected).length,
    exactCorrect:scored.filter(row=>row.expected&&row.baseline===row.expected).length,
    modelCorrect:scored.filter(row=>row.expected&&row.prediction===row.expected).length,
    wrongAccepted:scored.filter(row=>row.prediction&&row.prediction!==row.expected).length,
    unknownRejected:scored.filter(row=>!row.expected&&!row.prediction).length
  }};
}
function init(){
  get("case").innerHTML=cases.map(item=>'<option value="'+item.id+'">'+item.id+' · '+item.name+'</option>').join("");
  get("case").onchange=render;
  get("export").onclick=()=>{
    const data=state();
    save(data.borrower.id+"-evidence.json",JSON.stringify({schemaVersion:1,synthetic:true,...data,memo:memo(data),reviewLog:activeReview().log},null,2),"application/json");
  };
  get("download").onclick=()=>{
    const {borrower}=state();
    const rows=buildRows(borrower.id);
    const columns=Object.keys(rows[0]);
    const csv=[columns.join(","),...rows.map(row=>columns.map(key=>'"'+String(row[key]).replace(/"/g,'""')+'"').join(","))].join("\n");
    save(borrower.id+"-source.csv",csv,"text/csv");
  };
  const {scored,totals}=evaluate();
  get("evaluation").innerHTML='<p>'+totals.modelCorrect+'/'+totals.known+' known held-out labels mapped correctly by character-trigram matching, versus '+totals.exactCorrect+'/'+totals.known+' for normalised exact matching. '+totals.unknownRejected+'/'+(totals.cases-totals.known)+' out-of-schema labels were withheld. '+totals.wrongAccepted+' incorrect model suggestions passed the similarity threshold.</p><p class="muted">Synthetic, hand-authored challenge set. Scores are cosine similarity, not calibrated probabilities. Model suggestions require analyst review.</p><div class="scroll"><table><thead><tr><th>Held-out label</th><th>Expected</th><th>Exact baseline</th><th>Model</th></tr></thead><tbody>'+scored.map(row=>'<tr><td>'+safe(row.label)+'</td><td>'+(names[row.expected]||"Abstain")+'</td><td>'+(names[row.baseline]||"Abstain")+'</td><td>'+(names[row.prediction]||"Abstain")+'</td></tr>').join("")+'</tbody></table></div>';
  render();
}
if(typeof document!=="undefined") init();
</script>
</body>
</html>
